server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hinter dem Coolify-Proxy (HTTPS) relative Redirects verwenden,
    # sonst leitet /pullover-1 -> http://...:80/pullover-1/ um
    absolute_redirect off;

    # Studien-Prototyp: nie in Suchmaschinen aufnehmen
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Healthcheck fuer Coolify/Docker
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Saubere URLs: /pullover-1 -> /pullover-1/index.html, /impressum -> /impressum.html
    location / {
        # HTML immer neu pruefen lassen, damit Aenderungen sofort sichtbar sind
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ $uri.html =404;
    }

    # Assets lange cachen
    location /assets/ {
        # Assets sind ueber ?v=<hash> versioniert und duerfen lange gecacht werden
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    error_page 404 /404.html;
}
